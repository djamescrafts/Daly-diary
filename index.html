<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Diary</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root{--paper:#f7f4ef;--ink:#1d2421;--muted:#78817b;--line:#e5e0d7;--sage:#a8c5ad;--sage-deep:#315b4b;--coral:#e6896f;--card:#fffdfa;--shadow:0 20px 50px rgba(38,48,42,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input{font:inherit} button{cursor:pointer} .grain{background-image:radial-gradient(rgba(29,36,33,.04) .7px,transparent .7px);background-size:8px 8px}
    .serif{font-family:Georgia,"Times New Roman",serif}.soft{box-shadow:var(--shadow)} .hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}
    .ring{background:conic-gradient(var(--sage-deep) var(--progress),#dfe9e0 0);}
    @media (max-width:800px){.desktop-only{display:none!important}.shell{grid-template-columns:1fr!important}.rail{display:none}.content{max-width:100%!important}.topbar{padding:14px 18px!important}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const {useEffect,useMemo,useRef,useState}=React;
    const html=htm.bind(React.createElement);
    const Icon=({children,size=18,stroke=1.8})=>html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=${stroke} stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${children}</svg>`;
    const icons={home:html`<${Icon}><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/></${Icon}>`,book:html`<${Icon}><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/></${Icon}>`,people:html`<${Icon}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></${Icon}>`,search:html`<${Icon}><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></${Icon}>`,heart:html`<${Icon}><path d="M20.8 8.6c0 5.4-8.8 10.1-8.8 10.1S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/></${Icon}>`,comment:html`<${Icon}><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-4-.9L4 20l1.7-3.5A7.3 7.3 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/></${Icon}>`,plus:html`<${Icon}><path d="M12 5v14M5 12h14"/></${Icon}>`,close:html`<${Icon}><path d="m6 6 12 12M18 6 6 18"/></${Icon}>`,camera:html`<${Icon}><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></${Icon}>`,check:html`<${Icon}><path d="m5 12 4 4L19 6"/></${Icon}>`,more:html`<${Icon}><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></${Icon}>`};
    const people=[{id:1,name:'Maya Chen',handle:'@mayachen',initials:'MC',color:'#e5b59d',mutual:'3 mutual friends',photo:null},{id:2,name:'Jon Bell',handle:'@jonbell',initials:'JB',color:'#b7c9dc',mutual:'7 mutual friends',photo:null},{id:3,name:'Priya Shah',handle:'@priyashah',initials:'PS',color:'#d4c095',mutual:'1 mutual friend',photo:null}];
    const posts=[{id:1,name:'Maya Chen',time:'18 min ago',initials:'MC',color:'#e5b59d',text:'A small win today: I finally made the lemon olive-oil cake I kept bookmarking. The kitchen still smells like sunlight.',image:null,likes:24,comments:6},{id:2,name:'Jon Bell',time:'1 hr ago',initials:'JB',color:'#b7c9dc',text:'Found a quiet corner of the city. Keeping this one in the diary.',image:null,likes:18,comments:3}];
    function Avatar({person,size='md',online=false}){let cls=size==='lg'?'w-14 h-14 text-lg':size==='sm'?'w-9 h-9 text-xs':'w-11 h-11 text-sm';return html`<div className="relative shrink-0"><div className=${cls+" rounded-full overflow-hidden flex items-center justify-center font-semibold text-[#23352d]"} style=${{background:person.color}}>${person.photo?html`<img src=${person.photo} alt=${person.name} className="w-full h-full object-cover"/>`:person.initials}</div>${online&&html`<span className="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-[#5f9d75] border-2 border-white"/>`}</div>`}
    function Sidebar({active,setActive}){return html`<aside className="rail w-[230px] shrink-0 pt-8 pr-5"><div className="px-3 mb-10"><div className="flex items-center gap-2"><div className="w-9 h-9 rounded-[13px] bg-[#315b4b] text-[#f7f4ef] flex items-center justify-center shadow-sm"><svg width="25" height="25" viewBox="0 0 32 32" fill="none" aria-label="Old-school diary logo"><path d="M8 6.5C8 5.4 8.9 4.5 10 4.5h13v22H10c-1.1 0-2-.9-2-2v-18Z" fill="#e6896f" stroke="#f7f4ef" stroke-width="1.7"/><path d="M10 4.5h13v22H10c-1.1 0-2-.9-2-2v-18C8 5.4 8.9 4.5 10 4.5Z" stroke="#f7f4ef" stroke-width="1.7"/><path d="M12 9h7M12 13h6M12 17h7" stroke="#fffdfa" stroke-width="1.5" stroke-linecap="round"/><path d="M23 10l3-2v17l-3 1.5V10Z" fill="#d9e6da" stroke="#f7f4ef" stroke-width="1.4"/><path d="M24.5 5.5v5" stroke="#f7f4ef" stroke-width="1.7" stroke-linecap="round"/></svg></div><div><div className="font-bold tracking-tight text-lg">Daily Diary</div><div className="text-[11px] text-[#78817b]">a softer social space</div></div></div></div><nav className="space-y-1">${[['home','Home'],['book','My diary'],['people','People'],['appearance','Customize']].map(([key,label])=>html`<button key=${key} onClick=${()=>setActive(key)} className=${"w-full flex items-center gap-3 px-3 py-3 rounded-xl text-left transition "+(active===key?'bg-[#e4eee6] text-[#315b4b] font-semibold':'text-[#69736d] hover:bg-[#eeeae2]')}>${icons[key]||icons.book}<span>${label}</span>${key==='people'&&html`<span className="ml-auto text-[11px] bg-[#e6896f] text-white rounded-full px-2 py-0.5">2</span>`}</button>`)}</nav><div className="mt-12 px-3"><div className="text-[11px] uppercase tracking-[.16em] text-[#9aa19b] mb-3">Your space</div><button className="flex items-center gap-3 text-[#69736d] text-sm py-2"><div className="w-8 h-8 rounded-full bg-[#d9e6da] flex items-center justify-center text-[#315b4b]">✦</div>Saved moments</button><button className="flex items-center gap-3 text-[#69736d] text-sm py-2"><div className="w-8 h-8 rounded-full bg-[#f2ded5] flex items-center justify-center text-[#a45c4c]">◌</div>Close friends</button></div><div className="mt-16 px-3 text-xs leading-5 text-[#919891]">Daily Diary is a prototype. Your posts and friend actions stay in this session.</div></aside>`}
    function Header({active,setActive,profileName,profileImage,tagline}){return html`<header className="topbar h-[74px] border-b border-[#e5e0d7] flex items-center justify-between px-8 bg-[#f7f4ef]/95 backdrop-blur sticky top-0 z-20"><div className="flex items-center gap-3"><button className="md:hidden w-9 h-9 rounded-lg hover:bg-[#eeeae2]" aria-label="Open menu">${icons.more}</button><div className="hidden sm:block text-sm font-semibold text-[#78817b]">${active==='home'?'Your circle':active==='book'?'Your diary':active==='people'?'People you may know':'Customize your space'}</div></div><div className="flex items-center gap-3"><div className="hidden sm:block text-right"><div className="text-sm font-semibold">${profileName}</div><div className="text-[11px] text-[#89928c]">${tagline}</div></div><button className="w-9 h-9 rounded-full overflow-hidden bg-[#d9e6da] text-[#315b4b] flex items-center justify-center font-semibold" aria-label="Your profile">${profileImage?html`<img src=${profileImage} alt="Your profile" className="w-full h-full object-cover"/>`:profileName.slice(0,2).toUpperCase()}</button></div></header>`}
    function Composer({onPost,postCount}){const [value,setValue]=useState('');const [file,setFile]=useState(null);const [limitNotice,setLimitNotice]=useState('');const ref=useRef();const submit=e=>{e.preventDefault();if(postCount>=2){setLimitNotice('You’ve reached today’s two-post limit. Come back tomorrow.');return}if(!value.trim()&&!file)return;onPost({text:value.trim()||'A little moment from today.',image:file});setValue('');setFile(null);setLimitNotice('')};return html`<form onSubmit=${submit} className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-4 soft"><div className="flex gap-3"><${Avatar} person=${{initials:'AM',color:'#d9e6da'}}/><textarea value=${value} onChange=${e=>setValue(e.target.value)} placeholder=${postCount>=2?'You’ve written today’s two diary posts':'What is today holding?'} rows="2" disabled=${postCount>=2} className="flex-1 resize-none outline-none bg-transparent placeholder:text-[#a7ada8] text-[15px] leading-6 disabled:opacity-60"></textarea></div>${file&&html`<div className="mt-3 relative"><img src=${file} alt="Selected diary image" className="max-h-48 rounded-xl object-cover"/><button type="button" onClick=${()=>setFile(null)} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 text-white flex items-center justify-center">${icons.close}</button></div>`}<div className="mt-3 pt-3 border-t border-[#eeeae2] flex items-center justify-between"><div className="flex items-center gap-1"><input ref=${ref} type="file" accept="image/*" className="hidden" disabled=${postCount>=2} onChange=${e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>setFile(r.result);r.readAsDataURL(f)}}}/><button type="button" onClick=${()=>ref.current?.click()} disabled=${postCount>=2} className="px-2 py-1.5 rounded-lg text-sm text-[#69736d] hover:bg-[#f2efe9] flex items-center gap-2 disabled:opacity-40">${icons.camera}<span className="hidden sm:inline">Add a photo</span></button><span className="text-xs text-[#a3aaa4]">${postCount}/2 posts today</span></div><button className="h-9 px-4 rounded-lg bg-[#315b4b] text-white text-sm font-semibold hover:bg-[#24483b] disabled:bg-[#d8ddd8] disabled:text-[#89928c]" type="submit" disabled=${postCount>=2}>${postCount>=2?'Limit reached':'Write in diary'}</button></div>${limitNotice&&html`<div className="mt-3 text-xs text-[#b4594b]" role="alert">${limitNotice}</div>`}</form>`}
    function Post({post,onLike}){const [liked,setLiked]=useState(false);return html`<article className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl overflow-hidden"><div className="p-4 flex items-center gap-3"><${Avatar} person=${post}/><div className="flex-1"><div className="text-sm font-semibold">${post.name}</div><div className="text-xs text-[#939b95]">${post.time} · friends</div></div><button className="text-[#9aa19b] p-1" aria-label="More options">${icons.more}</button></div><div className="px-4 pb-4 text-[15px] leading-6">${post.text}</div>${post.image&&html`<img src=${post.image} alt="Diary moment" className="w-full max-h-[430px] object-cover"/>`}<div className="p-4 flex items-center justify-between text-xs text-[#89928c]"><span>${post.likes+(liked?1:0)} likes</span><span>${post.comments} comments</span></div><div className="mx-4 border-t border-[#eeeae2] flex"><button onClick=${()=>setLiked(!liked)} className=${"flex-1 py-3 flex items-center justify-center gap-2 text-sm "+(liked?'text-[#c96654]':'text-[#78817b]')}>${icons.heart}<span>${liked?'Liked':'Like'}</span></button><button className="flex-1 py-3 flex items-center justify-center gap-2 text-sm text-[#78817b]">${icons.comment}<span>Comment</span></button></div></article>`}
    function AddFriendModal({person,onClose,onAdded}){const [progress,setProgress]=useState(0);const [verified,setVerified]=useState(false);const [error,setError]=useState('');const timer=useRef(null);useEffect(()=>()=>clearInterval(timer.current),[]);const start=()=>{if(verified)return;setError('');setProgress(0);clearInterval(timer.current);const startTime=Date.now();timer.current=setInterval(()=>{const p=Math.min(100,((Date.now()-startTime)/10000)*100);setProgress(p);if(p>=100){clearInterval(timer.current);setVerified(true)}},50)};const stop=()=>{if(verified)return;clearInterval(timer.current);if(progress<100){setProgress(0);setError('Keep holding until the full 10 seconds are complete.')}};const send=()=>{if(!verified){setError('You need to verify the photo first.');return}onAdded(person);onClose()};return html`<div className="fixed inset-0 z-50 bg-[#1d2421]/45 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label=${'Add '+person.name}><div className="w-full max-w-[480px] bg-[#fffdfa] rounded-3xl soft overflow-hidden"><div className="p-5 border-b border-[#e5e0d7] flex items-center justify-between"><div><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Friend request</div><h2 className="serif text-2xl mt-1">Before you connect</h2></div><button onClick=${onClose} className="w-9 h-9 rounded-full hover:bg-[#f2efe9] flex items-center justify-center" aria-label="Close">${icons.close}</button></div><div className="p-6"><div className="flex items-center gap-3 mb-5"><${Avatar} person=${person} size="lg"/><div><div className="font-semibold">${person.name}</div><div className="text-sm text-[#89928c]">${person.handle} · ${person.mutual}</div></div></div><div className="rounded-2xl bg-[#f2f5ef] p-4 mb-5"><div className="flex gap-3"><div className="w-9 h-9 rounded-full bg-[#d9e6da] text-[#315b4b] flex items-center justify-center shrink-0">i</div><div className="text-sm leading-5 text-[#52605a]">To help keep Daily Diary human, look at this photo for <strong className="text-[#315b4b]">10 seconds</strong> before adding ${person.name}. This is a simple attention check — no photo is stored.</div></div></div><div className="rounded-2xl border border-[#e5e0d7] p-4"><div className="flex items-center gap-4"><div className="relative w-[82px] h-[82px] rounded-full p-[6px] ring" style=${{'--progress':progress+'%'}}><div className="w-full h-full rounded-full bg-[#fffdfa] flex items-center justify-center overflow-hidden"><img src=${person.photo} alt=${person.name+' verification photo'} className="w-full h-full object-cover"/></div></div><div className="flex-1"><div className="text-sm font-semibold">Photo check</div><div className="text-xs text-[#89928c] mt-1">${verified?'Verified — you can send the request.':progress>0?'Keep holding… '+Math.ceil((100-progress)/10)+'s remaining':'Press and hold the button while viewing the photo.'}</div></div></div><button onMouseDown=${start} onMouseUp=${stop} onMouseLeave=${stop} onTouchStart=${start} onTouchEnd=${stop} className=${"w-full mt-4 h-11 rounded-xl text-sm font-semibold transition "+(verified?'bg-[#d9e6da] text-[#315b4b]':'bg-[#315b4b] text-white active:scale-[.99]')} aria-label="Press and hold for ten seconds">${verified?html`<span className="flex justify-center gap-2 items-center">${icons.check}Photo verified</span>`:'Press and hold · 10 seconds'}</button>${error&&html`<div className="mt-3 text-xs text-[#b4594b]" role="alert">${error}</div>`}</div><button onClick=${send} className=${"w-full mt-5 h-11 rounded-xl text-sm font-semibold "+(verified?'bg-[#e6896f] text-white hover:bg-[#d87965]':'bg-[#eeeae2] text-[#a2a9a3] cursor-not-allowed')}>${verified?'Add to my friends':'Verify photo to continue'}</button><div className="text-center text-[11px] text-[#a3aaa4] mt-3">You can remove friends anytime from People.</div></div></div></div>`}
    function People({onAdd,added}){return html`<div className="space-y-5"><div><h1 className="serif text-3xl">People you may know</h1><p className="text-sm text-[#89928c] mt-1">Small circles, real connections.</p></div><div className="grid gap-3">${people.map(p=>html`<div key=${p.id} className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-4 flex items-center gap-3"><${Avatar} person=${p} size="lg"/><div className="flex-1 min-w-0"><div className="font-semibold">${p.name}</div><div className="text-sm text-[#89928c]">${p.handle}</div><div className="text-xs text-[#a3aaa4] mt-1">${p.mutual}</div></div>${added.includes(p.id)?html`<span className="text-xs font-semibold text-[#315b4b] bg-[#e4eee6] px-3 py-2 rounded-lg">Requested</span>`:html`<button onClick=${()=>onAdd(p)} className="h-9 px-3 rounded-lg bg-[#315b4b] text-white text-sm font-semibold hover:bg-[#24483b]">Add friend</button>`}</div>`)}</div></div>`}
    function Appearance({bgColor,setBgColor,pattern,setPattern,musicName,setMusicName,musicSrc,setMusicSrc}){const fileRef=useRef();const patterns={none:'none',dots:'radial-gradient(rgba(49,91,75,.16) 1px, transparent 1px)',grid:'linear-gradient(rgba(49,91,75,.12) 1px, transparent 1px),linear-gradient(90deg, rgba(49,91,75,.12) 1px, transparent 1px)',stars:'radial-gradient(circle at 20% 20%, rgba(230,137,111,.3) 0 2px, transparent 3px),radial-gradient(circle at 80% 70%, rgba(49,91,75,.24) 0 2px, transparent 3px)'};const onMusic=e=>{const f=e.target.files?.[0];if(!f)return;setMusicName(f.name);setMusicSrc(URL.createObjectURL(f))};return html`<div className="space-y-5"><div><h1 className="serif text-3xl">Customize your space</h1><p className="text-sm text-[#89928c] mt-1">Give your diary a little old-school personality, MySpace-style.</p></div><section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Page background</div><div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">${[['#f7f4ef','Paper'],['#d9e6da','Sage'],['#f2ded5','Peach'],['#dbe5ef','Sky']].map(([c,l])=>html`<button onClick=${()=>setBgColor(c)} className=${"h-20 rounded-xl border-2 text-sm font-semibold "+(bgColor===c?'border-[#315b4b]':'border-transparent')} style=${{background:c}}>${l}</button>`)}</div><label className="flex items-center justify-between mt-4 text-sm text-[#52605a]">Custom color<input type="color" value=${bgColor} onChange=${e=>setBgColor(e.target.value)} className="w-12 h-9 rounded-lg border-0 bg-transparent"/></label><div className="mt-5 text-sm font-semibold text-[#52605a]">Pattern</div><div className="flex flex-wrap gap-2 mt-2">${Object.keys(patterns).map(k=>html`<button onClick=${()=>setPattern(k)} className=${"px-3 py-2 rounded-lg text-xs border "+(pattern===k?'bg-[#315b4b] text-white border-[#315b4b]':'border-[#e5e0d7] text-[#69736d]')}>${k==='none'?'None':k}</button>`)}</div></section><section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Background music</div><p className="text-sm text-[#89928c] mt-2 leading-5">Choose a song from your device. It stays local to this session and only plays when you press play.</p><div className="mt-4 flex gap-2"><input ref=${fileRef} type="file" accept="audio/*" className="hidden" onChange=${onMusic}/><button onClick=${()=>fileRef.current?.click()} className="h-10 px-4 rounded-lg bg-[#315b4b] text-white text-sm font-semibold">Choose music</button>${musicSrc&&html`<audio controls src=${musicSrc} className="h-10 flex-1 min-w-0"/>`}</div>${musicName&&html`<div className="mt-3 text-xs text-[#315b4b]">Now selected: ${musicName}</div>`}<div className="mt-3 text-[11px] text-[#a3aaa4]">Browsers require a tap before audio can play.</div></section><div className="rounded-2xl bg-[#e4eee6] p-4 text-sm text-[#52605a]">Your colors and pattern are remembered for this session. Music files are not uploaded or stored.</div></div>`}
    function ProfileSettings({profileName,setProfileName,tagline,setTagline,profileImage,setProfileImage,fontChoice,setFontChoice,textColor,setTextColor}){const ref=useRef();const onPhoto=e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>setProfileImage(r.result);r.readAsDataURL(f)}};return html`<section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Your profile & screen style</div><div className="flex items-center gap-4 mt-4"><div className="w-16 h-16 rounded-full overflow-hidden bg-[#d9e6da] flex items-center justify-center text-[#315b4b] font-semibold">${profileImage?html`<img src=${profileImage} alt="Your profile" className="w-full h-full object-cover"/>`:profileName.slice(0,2).toUpperCase()}</div><div><input ref=${ref} type="file" accept="image/*" className="hidden" onChange=${onPhoto}/><button onClick=${()=>ref.current?.click()} className="h-9 px-3 rounded-lg bg-[#315b4b] text-white text-sm font-semibold">Change profile picture</button><div className="text-[11px] text-[#a3aaa4] mt-2">Use a photo from your device.</div></div></div><div className="grid sm:grid-cols-2 gap-3 mt-4"><label className="text-sm text-[#52605a]">Display name<input value=${profileName} onChange=${e=>setProfileName(e.target.value)} className="mt-1 w-full h-10 rounded-lg border border-[#e5e0d7] bg-[#faf8f4] px-3 outline-none"/></label><label className="text-sm text-[#52605a]">Profile text<input value=${tagline} onChange=${e=>setTagline(e.target.value)} className="mt-1 w-full h-10 rounded-lg border border-[#e5e0d7] bg-[#faf8f4] px-3 outline-none"/></label></div><div className="grid sm:grid-cols-2 gap-3 mt-3"><label className="text-sm text-[#52605a]">Font<select value=${fontChoice} onChange=${e=>setFontChoice(e.target.value)} className="mt-1 w-full h-10 rounded-lg border border-[#e5e0d7] bg-[#faf8f4] px-3"><option value="system">Clean system</option><option value="serif">Classic serif</option><option value="rounded">Friendly rounded</option><option value="mono">Typewriter mono</option></select></label><label className="text-sm text-[#52605a]">Text color<input type="color" value=${textColor} onChange=${e=>setTextColor(e.target.value)} className="mt-1 w-full h-10 rounded-lg bg-[#faf8f4]"/></label></div></section>`}
    function PatternStudio({bgColor,setBgColor,pattern,setPattern,musicName,setMusicName,musicSrc,setMusicSrc,imageSrc,setImageSrc,imageName,setImageName,canGenerate,canPick,profileName,setProfileName,tagline,setTagline,profileImage,setProfileImage,fontChoice,setFontChoice,textColor,setTextColor}){const musicRef=useRef();const imageRef=useRef();const [prompt,setPrompt]=useState('soft nostalgic scrapbook pattern, hand-drawn stars, faded stickers, warm paper texture');const [size,setSize]=useState('1920x1080');const [busy,setBusy]=useState(false);const [notice,setNotice]=useState('');const sizes={'1920x1080':'1920 × 1080 px','2048x2048':'2048 × 2048 px','1080x1920':'1080 × 1920 px','2560x1440':'2560 × 1440 px'};const patterns=['none','dots','grid','stars'];const onMusic=e=>{const f=e.target.files?.[0];if(f){setMusicName(f.name);setMusicSrc(URL.createObjectURL(f))}};const onImage=e=>{const f=e.target.files?.[0];if(f){setImageName(f.name);setImageSrc(URL.createObjectURL(f));setNotice('Your image is now the page background.')}};const pickLibrary=async()=>{try{const chosen=await window.kreaApp.pickFiles({types:['image']});if(chosen?.[0]){setImageName(chosen[0].name||'Krea image');setImageSrc(chosen[0].url);setNotice('Your Krea image is now the page background.')}}catch(e){setNotice('The image library could not be opened.')}};const generatePattern=async()=>{const makeFallback=()=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360"><rect width="360" height="360" fill="#f2ded5"/><circle cx="55" cy="55" r="24" fill="#e6896f" opacity=".7"/><circle cx="305" cy="305" r="24" fill="#315b4b" opacity=".7"/><path d="M120 35c22 24 22 54 0 78M240 247c22 24 22 54 0 78M35 180c24-22 54-22 78 0M247 180c24-22 54-22 78 0" fill="none" stroke="#315b4b" stroke-width="6" stroke-linecap="round" opacity=".5"/><path d="M160 135l10 22 24 3-18 16 5 24-21-12-21 12 5-24-18-16 24-3z" fill="#fffdfa" opacity=".9"/></svg>`;setImageSrc('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));setImageName('Local seamless pattern tile');setNotice('A seamless tile was created locally because AI generation was unavailable.')};if(!canGenerate){makeFallback();return}setBusy(true);setNotice('Generating a seamless pattern…');try{const found=await window.kreaApp.listModels({category:'image'});const model=found?.models?.[0]?.id;if(!model)throw new Error('No image model is available');const schema=await window.kreaApp.modelSchema(model);const spec=schema.inputSchema||{};const props=spec.properties||{};const input={};const promptField=Object.keys(props).find(k=>/prompt|description|text/i.test(k));Object.keys(props).forEach(k=>{const p=props[k]||{};const vals=[...(p.enum||[]),...(p.const===undefined?[]:[p.const])];if(p.default!==undefined)input[k]=p.default;else if(vals.length)input[k]=vals[0]});const generatedPrompt=prompt+', perfectly seamless tileable repeating pattern, edges match exactly on all sides, no text, no logos, no interface elements';if(promptField)input[promptField]=generatedPrompt;const required=spec.required||[];required.forEach(k=>{if(input[k]===undefined){const p=props[k]||{};const vals=[...(p.enum||[]),...(p.const===undefined?[]:[p.const])];if(vals.length)input[k]=vals[0];else if(k.toLowerCase().includes('prompt'))input[k]=generatedPrompt;else if(k.toLowerCase().includes('ratio'))input[k]='1:1';else if(k.toLowerCase().includes('resolution'))input[k]='1K';else if(p.type==='string')input[k]='';}});const done=await window.kreaApp.generate({tool:'generate_image',model,input});if(!done?.urls?.[0])throw new Error('The pattern did not return an image');setImageSrc(done.urls[0]);setImageName('Generated seamless pattern');setNotice('Generated seamless pattern applied as a repeating tile.')}catch(e){makeFallback()}finally{setBusy(false)}};const downloadTemplate=()=>{const [w,h]=size.split('x').map(Number);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#f7f4ef"/><path d="M0 0h${w}v${h}H0z" fill="none" stroke="#315b4b" stroke-width="4" stroke-dasharray="18 18"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="42" fill="#315b4b">Daily Diary background template · ${w} × ${h}px</text></svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=`daily-diary-background-${size}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};return html`<div className="space-y-5"><div><h1 className="serif text-3xl">Customize your space</h1><p className="text-sm text-[#89928c] mt-1">Create a MySpace-style background with your own art, generated patterns, and exact canvas sizes.</p></div><${ProfileSettings} profileName=${profileName} setProfileName=${setProfileName} tagline=${tagline} setTagline=${setTagline} profileImage=${profileImage} setProfileImage=${setProfileImage} fontChoice=${fontChoice} setFontChoice=${setFontChoice} textColor=${textColor} setTextColor=${setTextColor}/><section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Upload your own image</div><div className="mt-4 flex flex-wrap gap-2"><input ref=${imageRef} type="file" accept="image/*" className="hidden" onChange=${onImage}/><button onClick=${()=>imageRef.current?.click()} className="h-10 px-4 rounded-lg bg-[#315b4b] text-white text-sm font-semibold">Upload image</button>${canPick&&html`<button onClick=${pickLibrary} className="h-10 px-4 rounded-lg border border-[#d8ded8] text-[#315b4b] text-sm font-semibold">Choose from Krea</button>`}</div>${imageName&&html`<div className="mt-3 text-xs text-[#315b4b]">Active background: ${imageName}</div>`}</section><section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Generate a custom pattern</div><textarea value=${prompt} onChange=${e=>setPrompt(e.target.value)} rows="3" className="w-full mt-3 rounded-xl border border-[#e5e0d7] bg-[#faf8f4] p-3 text-sm outline-none resize-none"/><button onClick=${generatePattern} disabled=${busy} className="mt-3 h-10 px-4 rounded-lg bg-[#e6896f] text-white text-sm font-semibold disabled:opacity-50">${busy?'Generating…':'Generate pattern'}</button>${notice&&html`<div className="mt-3 text-xs text-[#315b4b]" role="status">${notice}</div>`}</section><section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Canvas template size</div><div className="mt-3 flex gap-2"><select value=${size} onChange=${e=>setSize(e.target.value)} className="h-10 flex-1 rounded-lg border border-[#e5e0d7] bg-[#faf8f4] px-3 text-sm">${Object.entries(sizes).map(([v,l])=>html`<option value=${v}>${l}</option>`)}</select><button onClick=${downloadTemplate} className="h-10 px-4 rounded-lg border border-[#315b4b] text-[#315b4b] text-sm font-semibold">Download SVG template</button></div><div className="mt-2 text-xs text-[#89928c]">Use this exact size in Photoshop, Canva, or Procreate.</div></section><section className="bg-[#fffdfa] border border-[#e5e0d7] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b]">Colors, patterns & music</div><div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4">${[['#f7f4ef','Paper'],['#d9e6da','Sage'],['#f2ded5','Peach'],['#dbe5ef','Sky']].map(([c,l])=>html`<button onClick=${()=>{setBgColor(c);setImageSrc('');setImageName('')}} className="h-14 rounded-xl text-xs font-semibold border-2" style=${{background:c,borderColor:bgColor===c&&!imageSrc?'#315b4b':'transparent'}}>${l}</button>`)}</div><div className="flex flex-wrap gap-2 mt-3">${patterns.map(k=>html`<button onClick=${()=>{setPattern(k);setImageSrc('');setImageName('')}} className=${"px-3 py-2 rounded-lg text-xs border "+(pattern===k&&!imageSrc?'bg-[#315b4b] text-white':'border-[#e5e0d7] text-[#69736d]')}>${k}</button>`)}</div><div className="mt-4 flex gap-2"><input ref=${musicRef} type="file" accept="audio/*" className="hidden" onChange=${onMusic}/><button onClick=${()=>musicRef.current?.click()} className="h-10 px-4 rounded-lg bg-[#315b4b] text-white text-sm font-semibold">Choose music</button>${musicSrc&&html`<audio controls src=${musicSrc} className="h-10 flex-1 min-w-0"/>`}</div>${musicName&&html`<div className="mt-2 text-xs text-[#315b4b]">${musicName}</div>`}</section></div>`}
    function App(){const [active,setActive]=useState('home');const [modal,setModal]=useState(null);const [added,setAdded]=useState([]);const [postsState,setPostsState]=useState(posts);const [postDates,setPostDates]=useState([]);const [bgColor,setBgColor]=useState('#f7f4ef');const [pattern,setPattern]=useState('none');const [musicName,setMusicName]=useState('');const [musicSrc,setMusicSrc]=useState('');const [imageSrc,setImageSrc]=useState('');const [imageName,setImageName]=useState('');const [profileName,setProfileName]=useState('Amara Miles');const [tagline,setTagline]=useState('a little archive of today');const [profileImage,setProfileImage]=useState('');const [fontChoice,setFontChoice]=useState('system');const [textColor,setTextColor]=useState('#1d2421');const [canGenerate,setCanGenerate]=useState(false);const [canPick,setCanPick]=useState(false);const [ready,setReady]=useState(false);const todayKey=new Date().toISOString().slice(0,10);const postsToday=postDates.filter(d=>d===todayKey).length;const patternMap={none:'none',dots:'radial-gradient(rgba(49,91,75,.16) 1px, transparent 1px)',grid:'linear-gradient(rgba(49,91,75,.12) 1px, transparent 1px),linear-gradient(90deg, rgba(49,91,75,.12) 1px, transparent 1px)',stars:'radial-gradient(circle at 20% 20%, rgba(230,137,111,.3) 0 2px, transparent 3px),radial-gradient(circle at 80% 70%, rgba(49,91,75,.24) 0 2px, transparent 3px)'};useEffect(()=>{window.kreaApp?.capabilities?.then(c=>{setCanGenerate(c.includes('generate'));setCanPick(c.includes('pickFiles'))}).catch(()=>{});window.kreaApp?.ready?.then(async({parameters})=>{setReady(true);try{const s=await window.kreaApp.loadSettings();if(s?.added)setAdded(s.added);if(s?.postDates)setPostDates(s.postDates);if(s?.bgColor)setBgColor(s.bgColor);if(s?.pattern)setPattern(s.pattern);if(s?.profileName)setProfileName(s.profileName);if(s?.tagline)setTagline(s.tagline);if(s?.fontChoice)setFontChoice(s.fontChoice);if(s?.textColor)setTextColor(s.textColor)}catch(e){}})},[]);useEffect(()=>{if(ready&&window.kreaApp?.saveSettings)window.kreaApp.saveSettings({added,postDates,bgColor,pattern,profileName,tagline,fontChoice,textColor}).catch(()=>{})},[added,postDates,bgColor,pattern,ready]);const add=(p)=>{setAdded(a=>[...a,p.id]);};const post=p=>{if(postsToday>=2)return;setPostDates(d=>[...d,todayKey]);setPostsState(x=>[{...p,id:Date.now(),name:'Amara Miles',time:'just now',initials:'AM',color:'#d9e6da',likes:0,comments:0},...x])};return html`<div className="min-h-screen grain" style=${{backgroundColor:bgColor,color:textColor,fontFamily:fontChoice==='serif'?'Georgia, serif':fontChoice==='rounded'?'Trebuchet MS, sans-serif':fontChoice==='mono'?'ui-monospace, SFMono-Regular, monospace':'Inter, ui-sans-serif, system-ui, sans-serif',backgroundImage:imageSrc?`url(${imageSrc})`:patternMap[pattern],backgroundSize:imageSrc?(imageName.includes('seamless')?'360px 360px':'cover'):pattern==='grid'?'22px 22px':'26px 26px',backgroundPosition:'center',backgroundRepeat:imageSrc?(imageName.includes('seamless')?'repeat':'no-repeat'):'repeat'}}><${Header} active=${active} setActive=${setActive} profileName=${profileName} profileImage=${profileImage} tagline=${tagline}/><div className="shell max-w-[1180px] mx-auto flex gap-8 px-4 sm:px-8"><${Sidebar} active=${active} setActive=${setActive}/><main className="content w-full max-w-[650px] py-8" id="main">${active==='appearance'?html`<${PatternStudio} bgColor=${bgColor} setBgColor=${setBgColor} pattern=${pattern} setPattern=${setPattern} musicName=${musicName} setMusicName=${setMusicName} musicSrc=${musicSrc} setMusicSrc=${setMusicSrc} imageSrc=${imageSrc} setImageSrc=${setImageSrc} imageName=${imageName} setImageName=${setImageName} canGenerate=${canGenerate} canPick=${canPick} profileName=${profileName} setProfileName=${setProfileName} tagline=${tagline} setTagline=${setTagline} profileImage=${profileImage} setProfileImage=${setProfileImage} fontChoice=${fontChoice} setFontChoice=${setFontChoice} textColor=${textColor} setTextColor=${setTextColor}/>`:active==='people'?html`<${People} onAdd=${setModal} added=${added}/>`:active==='book'?html`<div className="space-y-5"><div><h1 className="serif text-3xl">My diary</h1><p className="text-sm text-[#89928c] mt-1">A gentle record of the days you want to remember.</p></div><${Composer} onPost=${post} postCount=${postsToday}/>${postsState.filter(p=>p.name==='Amara Miles').length?postsState.filter(p=>p.name==='Amara Miles').map(p=>html`<${Post} key=${p.id} post=${p}/>`):html`<div className="border border-dashed border-[#cfc9bd] rounded-2xl p-8 text-center text-sm text-[#89928c]">Your personal entries will appear here.</div>`}</div>`:html`<div className="space-y-5"><div className="mb-7"><div className="text-xs uppercase tracking-[.18em] text-[#9aa19b]">Tuesday, October 8</div><h1 className="serif text-4xl mt-2 leading-tight">A place for the<br/><em className="text-[#315b4b]">little things.</em></h1><p className="text-sm text-[#78817b] mt-3 max-w-[420px] leading-6">Share the moments that make up your day with people you actually know.</p></div><${Composer} onPost=${post} postCount=${postsToday}/>${postsState.map(p=>html`<${Post} key=${p.id} post=${p}/>`)}<div className="text-center text-xs text-[#a3aaa4] py-5">You’re all caught up · more tomorrow</div></div>`}</main><aside className="desktop-only w-[250px] shrink-0 pt-10"><div className="bg-[#e4eee6] rounded-2xl p-5"><div className="text-xs uppercase tracking-[.14em] text-[#5a7967]">Your week</div><div className="serif text-2xl mt-2 text-[#315b4b]">3 little wins</div><div className="text-sm text-[#5a7967] mt-1 leading-5">You’ve written three diary entries this week. Keep noticing.</div><div className="mt-4 h-2 bg-white/70 rounded-full overflow-hidden"><div className="h-full w-[60%] bg-[#7fa68a] rounded-full"/></div><div className="flex justify-between text-[11px] text-[#6f8d79] mt-2"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div></div><div className="mt-7 px-2"><div className="text-xs uppercase tracking-[.14em] text-[#9aa19b] mb-3">Your people</div><div className="space-y-3">${people.slice(0,2).map(p=>html`<div className="flex items-center gap-2" key=${p.id}><${Avatar} person=${p} size="sm" online=${true}/><div className="text-sm flex-1">${p.name}<div className="text-[11px] text-[#9aa19b]">active now</div></div><span className="text-[#c1c7c1]">›</span></div>`)}</div></div></aside></div>${modal&&html`<${AddFriendModal} person=${modal} onClose=${()=>setModal(null)} onAdded=${add}/>`}</div>`}
    window.kreaApp.ready.then(()=>ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`));
